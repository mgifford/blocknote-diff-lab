name: Page comparison tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: page-comparison-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:pages
      - run: pnpm test:a11y:local
      - name: Upload a11y evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-evidence-${{ github.run_id }}
          path: |
            reports/a11y
            test-results
          if-no-files-found: ignore
          retention-days: 30
