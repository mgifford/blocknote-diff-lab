name: Preview route smoke check

on:
  workflow_dispatch:
  schedule:
    # Weekly drift check for the external Vercel Playground previews.
    - cron: '17 13 * * 1'

permissions:
  contents: read

concurrency:
  group: preview-smoke
  cancel-in-progress: true

jobs:
  check:
    name: preview-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:previews
      - run: pnpm test:a11y:previews
      - name: Upload a11y evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-evidence-${{ github.run_id }}
          path: |
            reports/a11y
            test-results
          if-no-files-found: ignore
          retention-days: 30
